<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI探偵カメラ</title>
  <link rel="stylesheet" href="style.css">
  <!-- MediaPipe & PeerJS & QRスキャナーCDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
  <div class="app-container">
    <h1>🔍 AI探偵カメラ</h1>

    <!-- ================= 探索モード画面 ================= -->
    <div id="searchTab" class="tab-content active">
      <div class="control-group" style="border: 2px solid #007bff; background: #f0f7ff;">
        <label for="pcIdInput" style="color: #007bff;">🔗 PC接続用ID:</label>
        <div style="display: flex; gap: 5px; margin-bottom: 8px;">
          <input type="text" id="pcIdInput" placeholder="PC側のIDを入力 or QRスキャン" style="flex: 1;">
          <button onclick="connectToPC()" style="padding: 0 15px; background: #007bff; color: #fff; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">接続</button>
        </div>
        <!-- 📷 QRコードスキャンボタン & 停止ボタン -->
        <div style="display: flex; gap: 5px; margin-bottom: 5px;">
          <button onclick="startQrScanner()" style="flex: 1; padding: 8px; background: #28a745; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px;">📷 QRスキャン起動</button>
          <button onclick="stopQrScanner()" style="flex: 1; padding: 8px; background: #6c757d; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px;">⏹️ カメラ停止</button>
        </div>
        <div id="qr-reader" style="width: 100%; max-width: 260px; margin: 10px auto; display: none;"></div>
        <div id="connectionStatus" style="font-size: 12px; color: #666; margin-top: 5px;">ステータス: 未接続</div>
      </div>

      <div class="control-group" style="position: relative;">
        <label for="targetObject">探すもの (カタカナ/英語対応):</label>
        <div style="display: flex; gap: 5px;">
          <input type="text" id="targetObject" value="cup" placeholder="例: コップ または cup" autocomplete="off" oninput="filterSuggestions()" style="flex: 1;">
          <button onclick="updateTarget()" style="padding: 0 15px; background: #007bff; color: #fff; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">決定</button>
        </div>
        <!-- 🔽 サジェストリスト -->
        <div id="customSuggestions" style="display: none; position: absolute; left: 10px; right: 10px; top: 65px; background: #181818; border: 1px solid #444; border-radius: 4px; max-height: 130px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5);"></div>
      </div>

      <div class="camera-container" style="position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; margin-top: 10px;">
        <video id="video" autoplay muted playsinline style="width: 100%; display: block;"></video>
        <canvas id="outputCanvas" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
      </div>

      <div class="button-group" style="margin-top: 10px;">
        <button id="startButton" class="primary-btn" onclick="startCamera()" disabled>PCと接続してください</button>
        <button id="stopButton" class="danger-btn" onclick="stopCamera()" style="display:none;">停止</button>
      </div>

      <div id="status" class="status-box">ステータス: 初期化中...</div>

      <!-- 📁 フォルダ風の発見履歴を開くボタン -->
      <div style="margin-top: 25px;">
        <button onclick="openHistoryFolder()" style="width: 100%; padding: 14px; background: #ffc107; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
          📂 発見した物体の履歴フォルダを開く
        </button>
      </div>
    </div>
  </div>

  <!-- QRスキャナー制御用スクリプト -->
  <script>
    let html5QrCode = null;
    function startQrScanner() {
      const readerContainer = document.getElementById("qr-reader");
      readerContainer.style.display = "block";
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("qr-reader");
      }
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 200, height: 200 } },
        (decodedText) => {
          document.getElementById("pcIdInput").value = decodedText;
          stopQrScanner();
          alert("PCのIDを読み込みました！「接続」ボタンを押してください。");
        },
        (errorMessage) => {}
      ).catch(err => {
        alert("カメラの起動に失敗しました: " + err);
      });
    }
    function stopQrScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          const readerContainer = document.getElementById("qr-reader");
          readerContainer.style.display = "none";
        }).catch(err => {
          console.error("QRスキャナーの停止に失敗しました:", err);
        });
      }
    }
  </script>

  <script type="module" src="app.js"></script>

  <!-- 📁 フォルダ風ウィンドウ（履歴モーダル） -->
  <div id="historyFolderModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center;">
    <div style="background: #1e1e1e; width: 90%; max-width: 500px; height: 75%; border-radius: 12px; border: 2px solid #ffc107; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      <!-- フォルダヘッダー -->
      <div style="background: #2c2c2c; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444;">
        <h3 style="margin: 0; font-size: 16px; color: #ffc107;">📂 発見履歴フォルダ</h3>
        <div style="display: flex; gap: 8px;">
          <button onclick="clearGallery()" style="padding: 4px 10px; background: #dc3545; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 11px;">履歴クリア</button>
          <button onclick="closeHistoryFolder()" style="padding: 4px 10px; background: #6c757d; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 11px;">✕ 閉じる</button>
        </div>
      </div>
      <!-- フォルダ中身（グリッド表示） -->
      <div id="imageGallery" style="flex: 1; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; align-content: start;">
        <!-- 発見された画像がここに追加されます -->
      </div>
    </div>
  </div>

  <!-- 🔍 画像拡大プレビュー用モーダル -->
  <div id="imagePreviewModal" style="display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; flex-direction: column;" onclick="closePreview()">
    <img id="previewImage" style="max-width: 90%; max-height: 80%; border-radius: 8px; border: 3px solid #00ff00; object-fit: contain;">
    <div style="color: #fff; margin-top: 15px; font-size: 13px; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 4px;">画面をタップして閉じる</div>
  </div>
</body>
</html>
