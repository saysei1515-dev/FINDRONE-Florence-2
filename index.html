<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YOLO-World リアルタイム探索ファインダー</title>
  <!-- PeerJS & QRスキャナー用CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 10px 12px 14px;
      background: linear-gradient(160deg, #fff5f9 0%, #f5efff 52%, #eef9ff 100%);
      color: #5d4c5b;
      font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      gap: 10px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* 上部コントロールパネル */
    .control-panel {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(8px);
      padding: 12px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 2px solid #ffe2ee;
      box-shadow: 0 8px 24px rgba(214, 166, 194, 0.22);
      z-index: 10;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: #fffafd;
      border: 2px solid #f2d4e3;
      border-radius: 9999px;
      padding: 9px 16px;
      color: #544352;
      font-size: 14.5px;
      outline: none;
      box-shadow: inset 0 2px 6px rgba(235, 190, 212, 0.18);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]::placeholder {
      color: #b8a0b3;
    }

    input[type="text"]:focus {
      border-color: #f39ac1;
      box-shadow: 0 0 0 4px rgba(243, 154, 193, 0.22);
    }

    /* 各ボタン：両サイドを半円のように丸く＆淡いパステルカラー */
    button {
      background: linear-gradient(135deg, #c2e5ff 0%, #dacbff 100%);
      color: #493e66;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 9999px;
      padding: 9px 18px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 5px 14px rgba(168, 154, 214, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.03);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(168, 154, 214, 0.2);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      box-shadow: none;
    }

    .connect-box {
      background: #fff7fb;
      padding: 10px;
      border-radius: 20px;
      border: 1.5px dashed #f2c6da;
    }

    .btn-connect {
      background: linear-gradient(135deg, #baeaff 0%, #c8d8ff 100%);
      color: #3c506b;
      box-shadow: 0 4px 12px rgba(145, 195, 235, 0.28);
    }

    .btn-qr-start {
      flex: 1;
      padding: 8px 14px;
      background: linear-gradient(135deg, #c6f6d5 0%, #b4efe6 100%);
      color: #2f5e4e;
      font-size: 12.5px;
      box-shadow: 0 4px 12px rgba(138, 216, 185, 0.28);
    }

    .btn-qr-stop {
      flex: 1;
      padding: 8px 14px;
      background: linear-gradient(135deg, #f3e8ff 0%, #ffd6e7 100%);
      color: #694b63;
      font-size: 12.5px;
      box-shadow: 0 4px 12px rgba(210, 175, 210, 0.24);
    }

    /* QRリーダー領域：下半分が切れないように十分な高さと余白を確保 */
    #qr-reader {
      width: 100%;
      max-width: 280px;
      min-height: 250px;
      margin: 10px auto 4px;
      padding: 6px;
      display: none;
      background: #ffffff;
      border-radius: 20px;
      border: 2px solid #f7c6db;
      box-shadow: 0 6px 16px rgba(225, 165, 195, 0.22);
      overflow: visible;
    }

    #qr-reader video {
      width: 100% !important;
      height: auto !important;
      min-height: 220px;
      max-height: none !important;
      object-fit: contain !important;
      border-radius: 14px;
      display: block;
    }

    #connectionStatus {
      font-size: 11.5px;
      color: #8c7388;
      margin-top: 6px;
      padding-left: 6px;
    }

    /* 中央カメラビューファインダー */
    .viewfinder-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      flex: 1 0 auto;
      padding: 2px 0;
    }

    .viewfinder {
      position: relative;
      width: 96%;
      max-width: 480px;
      aspect-ratio: 4 / 3;
      min-height: 220px;
      max-height: 340px;
      background: #fdf2f7;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 10px 26px rgba(206, 156, 186, 0.28);
      border: 3px solid #ffffff;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: block;
    }

    /* ステータスバー */
    .status-bar {
      background: rgba(255, 255, 255, 0.88);
      padding: 8px 16px;
      border-radius: 9999px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #6c5ce7;
      border: 2px solid #ebe4ff;
      box-shadow: 0 4px 14px rgba(186, 172, 224, 0.2);
    }

    /* 履歴フォルダボタンエリア */
    .folder-panel {
      padding: 0 4px;
    }

    #folderBtn {
      background: linear-gradient(135deg, #fff0b3 0%, #ffe0a3 100%);
      color: #6b5224;
      width: 100%;
      padding: 11px 20px;
      font-size: 14px;
      border-radius: 9999px;
      box-shadow: 0 6px 16px rgba(235, 198, 120, 0.3);
    }

    /* フッターアクション */
    .action-panel {
      padding: 0 4px;
    }

    /* 起動ボタン（淡いミントグリーン系）と停止ボタン（淡いコーラルピンク系）を明確に区別 */
    #startButton {
      background: linear-gradient(135deg, #b5f2d6 0%, #9ce8d8 100%);
      color: #245c4b;
      font-size: 15px;
      width: 100%;
      padding: 13px 22px;
      border-radius: 9999px;
      box-shadow: 0 6px 18px rgba(118, 212, 182, 0.36);
    }

    #stopButton {
      background: linear-gradient(135deg, #ffb8c6 0%, #ffa3b5 100%);
      color: #6e2939;
      font-size: 15px;
      width: 100%;
      padding: 13px 22px;
      border-radius: 9999px;
      box-shadow: 0 6px 18px rgba(238, 136, 158, 0.38);
    }

    /* 履歴モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(92, 72, 92, 0.45);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }

    .modal-card {
      background: #fffafd;
      width: 90%;
      max-width: 500px;
      height: 75%;
      border-radius: 26px;
      border: 3px solid #ffe0ec;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 14px 32px rgba(175, 125, 155, 0.32);
    }

    .modal-header {
      background: #fff0f6;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid #f7d6e4;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 15px;
      color: #7a4b63;
    }

    .btn-clear {
      padding: 6px 14px;
      background: linear-gradient(135deg, #ffc2d1 0%, #ffb3c6 100%);
      color: #6e2939;
      font-size: 11.5px;
    }

    .btn-close {
      padding: 6px 14px;
      background: linear-gradient(135deg, #e2d9f3 0%, #d4c7ed 100%);
      color: #4d4266;
      font-size: 11.5px;
    }

    #imageGallery {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
      align-content: start;
    }

    /* 拡大プレビューモーダル */
    #imagePreviewModal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(75, 58, 78, 0.78);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #previewImage {
      max-width: 90%;
      max-height: 80%;
      border-radius: 20px;
      border: 3px solid #b5f2d6;
      object-fit: contain;
      background: #ffffff;
    }

    .preview-hint {
      color: #5c4d5b;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.92);
      padding: 7px 18px;
      border-radius: 9999px;
    }
  </style>
</head>
<body>

  <!-- コントロールエリア -->
  <div class="control-panel">
    <!-- FlaskサーバーIP設定 -->
    <div class="input-row">
      <input type="text" id="serverIp" placeholder="FlaskサーバーIP (例: 192.168.11.x)" />
    </div>

    <!-- PeerJS PC接続・QR読み取りエリア -->
    <div class="connect-box">
      <div class="input-row" style="margin-bottom: 8px;">
        <input type="text" id="pcIdInput" placeholder="PC側のPeer IDを入力 or QRスキャン" />
        <button class="btn-connect" onclick="connectToPC()">接続</button>
      </div>
      <div class="input-row">
        <button class="btn-qr-start" onclick="startQrScanner()">📷 QRスキャン</button>
        <button class="btn-qr-stop" onclick="stopQrScanner()">⏹️ スキャン停止</button>
      </div>
      <div id="qr-reader"></div>
      <div id="connectionStatus">ステータス: 未接続</div>
    </div>

    <!-- 検索ワード入力行 -->
    <div class="input-row">
      <!-- 日本語入力可能（サーバー側で自動翻訳されます） -->
      <input type="text" id="targetObject" value="コップ" placeholder="探すもの (例: コップ, ギター)" autocomplete="off" />
      <button onclick="updateTarget()">決定</button>
    </div>
  </div>

  <!-- カメラ映像エリア -->
  <div class="viewfinder-container">
    <div class="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="outputCanvas"></canvas>
    </div>
  </div>

  <!-- ステータス -->
  <div class="status-bar" id="status">ステータス: PCと接続してください</div>

  <!-- 履歴フォルダボタン -->
  <div class="folder-panel">
    <button id="folderBtn" onclick="openHistoryFolder()">📂 発見した物体の履歴フォルダを開く</button>
  </div>

  <!-- スタート・ストップボタン -->
  <div class="action-panel">
    <button id="startButton" onclick="startDetection()" disabled>PCと接続してください</button>
    <button id="stopButton" onclick="stopDetection()" style="display:none;">停止</button>
  </div>

  <!-- スクリプト読み込み -->
  <script src="app.js"></script>

  <!-- 履歴モーダル（フォルダ風） -->
  <div id="historyFolderModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>📂 発見履歴フォルダ</h3>
        <div style="display: flex; gap: 8px;">
          <button class="btn-clear" onclick="clearGallery()">履歴クリア</button>
          <button class="btn-close" onclick="closeHistoryFolder()">✕ 閉じる</button>
        </div>
      </div>
      <div id="imageGallery"></div>
    </div>
  </div>

  <!-- 拡大プレビュー用モーダル -->
  <div id="imagePreviewModal" onclick="closePreview()">
    <img id="previewImage">
    <div class="preview-hint">画面をタップして閉じる</div>
  </div>
</body>
</html>
