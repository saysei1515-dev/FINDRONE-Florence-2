<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FINDRONE</title>
  <!-- PeerJS & QRスキャナー用CDN & アイコンフォント -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 10px 14px calc(env(safe-area-inset-bottom, 24px) + 76px); /* Android等ナビ被り対策 */
      background: linear-gradient(160deg, #fff6f9 0%, #f4eeff 52%, #eef9ff 100%);
      color: #5c475a;
      font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* タブ切り替え制御 */
    .tab-content {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      animation: fadeIn 0.2s ease;
    }

    .tab-content.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* トップタイトル */
    .app-header {
      text-align: center;
      margin: 10px 0 16px;
      font-size: 14px;
      letter-spacing: 2px;
      color: #92758e;
      font-weight: bold;
      text-transform: uppercase;
    }

    /* 淡く柔らかなカード */
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 2px solid #ffdce8;
      border-radius: 28px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 24px rgba(216, 168, 196, 0.18);
    }

    /* 入力フォーム類 */
    .input-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-icon {
      font-size: 20px;
      color: #a894a5;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: #fffafc;
      border: 2.5px solid #f2d4e3;
      border-radius: 9999px;
      padding: 10px 18px;
      color: #544352;
      font-size: 14px;
      outline: none;
      box-shadow: inset 0 2px 6px rgba(235, 190, 212, 0.15);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: #f39ac1;
      box-shadow: 0 0 0 4px rgba(243, 154, 193, 0.2);
    }

    /* 両サイドを丸くしたボタンたち */
    button {
      font-family: inherit;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 9999px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: transform 0.1s ease, box-shadow 0.15s ease, filter 0.15s ease, background 0.2s ease, color 0.2s ease;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.02);
    }

    button:active:not(:disabled) {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ホーム画面の大型リンクボタン */
    .btn-massive {
      width: 82%;
      max-width: 260px;
      padding: 16px 24px;
      font-size: 16px;
      box-shadow: 0 6px 18px rgba(118, 212, 182, 0.25);
    }

    .btn-find {
      background: linear-gradient(135deg, #aef1e0 0%, #76d3bd 100%);
      color: #1a4f43;
    }

    .btn-settings-link {
      background: linear-gradient(135deg, #ebe3f3 0%, #cac2d3 100%);
      color: #544755;
    }

    /* 汎用ボタンスタイル */
    .btn-decision {
      background: linear-gradient(135deg, #c0f4b3 0%, #90dc7c 100%);
      color: #274b1e;
      padding: 10px 20px;
      box-shadow: 0 4px 12px rgba(150, 220, 130, 0.25);
    }

    .btn-save {
      background: linear-gradient(135deg, #a7eaff 0%, #5bc5f0 100%);
      color: #124355;
      font-size: 15px;
      width: 70%;
      padding: 12px 24px;
      box-shadow: 0 5px 15px rgba(91, 197, 240, 0.3);
    }

    .btn-connect {
      background: linear-gradient(135deg, #c2e5ff 0%, #90c2fb 100%);
      color: #2b3e55;
    }

    /* 探索開始と停止のトグル切り替え（「/」トグルカラー） */
    #startButton {
      background: linear-gradient(135deg, #ffe5aa 0%, #ffd061 100%);
      color: #634b12;
      width: 100%;
      padding: 13px;
      font-size: 16px;
      box-shadow: 0 6px 18px rgba(255, 208, 97, 0.3);
    }

    /* 停止中：パステルレッドへ変身 */
    #startButton.active-stop {
      background: linear-gradient(135deg, #ffb6c5 0%, #ffa3b5 100%) !important;
      color: #6d2737 !important;
      box-shadow: 0 6px 18px rgba(255, 163, 181, 0.35) !important;
    }

    /* QRコードトグル（開始/停止） */
    .btn-qr-toggle {
      width: 100%;
      background: linear-gradient(135deg, #ecfdf3 0%, #bff2d7 100%);
      color: #205c40;
    }

    .btn-qr-toggle.active-stop {
      background: linear-gradient(135deg, #fff1f2 0%, #fecdd3 100%) !important;
      color: #881337 !important;
    }

    /* QRリーダー */
    #qr-reader {
      width: 100%;
      max-width: 260px;
      min-height: 240px;
      margin: 10px auto;
      padding: 6px;
      display: none;
      background: #ffffff;
      border-radius: 20px;
      border: 2px solid #ffd2e2;
      box-shadow: 0 6px 16px rgba(225, 165, 195, 0.18);
    }

    #qr-reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 14px;
    }

    /* カメラ・プレビューファインダー */
    .viewfinder-outer {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #fff3f7;
      border-radius: 24px;
      overflow: hidden;
      border: 3px solid #ffffff;
      box-shadow: 0 8px 24px rgba(206, 156, 186, 0.15);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ステータス */
    .status-area {
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      color: #a2759e;
      margin: 2px 0;
    }

    /* 履歴フォルダボタン */
    #folderBtn {
      background: linear-gradient(135deg, #ccefff 0%, #b3dcff 100%);
      color: #234c6b;
      width: 100%;
      padding: 12px;
      font-size: 14px;
      box-shadow: 0 4px 14px rgba(179, 220, 255, 0.28);
    }

    /* Android等に被らないフッター固定ナビゲーション */
    .nav-bar {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-top: 1.5px solid #ffe3ec;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 10px calc(env(safe-area-inset-bottom, 24px) + 8px); /* 底辺安全 padding */
      box-shadow: 0 -4px 20px rgba(214, 166, 194, 0.12);
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: #bfaab9;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 12px;
      gap: 3px;
      box-shadow: none;
      border-radius: 12px;
    }

    .nav-item i {
      font-size: 21px;
    }

    .nav-item.active {
      color: #72d3bd;
    }

    /* 履歴モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(85, 68, 85, 0.45);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }

    .modal-card {
      background: #fffbfd;
      width: 90%;
      max-width: 480px;
      height: 75%;
      border-radius: 26px;
      border: 3px solid #ffdae7;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(175, 125, 155, 0.25);
    }

    .modal-header {
      background: #fff1f5;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid #ffd4e4;
      gap: 6px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 14px;
      color: #7c4c64;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-clear {
      padding: 6px 12px;
      background: linear-gradient(135deg, #ffc2cc 0%, #ffabb7 100%);
      color: #6d242e;
      font-size: 11px;
    }

    .btn-close {
      padding: 6px 12px;
      background: linear-gradient(135deg, #e4d8f3 0%, #ccc2e3 100%);
      color: #493b5e;
      font-size: 11px;
    }

    .btn-back-folder {
      padding: 6px 12px;
      background: linear-gradient(135deg, #dff7ee 0%, #bcebe0 100%);
      color: #20574a;
      font-size: 11px;
    }

    #imageGallery {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .folder-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .folder-card {
      position: relative;
      background: #fff6fa;
      border: 2px solid #ffd5e5;
      border-radius: 18px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(214, 166, 194, 0.15);
    }

    .folder-thumb {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #ffffff;
      background: #f4eeff;
    }

    .folder-name {
      font-size: 12px;
      font-weight: 700;
      color: #5c475a;
      text-align: center;
      word-break: break-all;
    }

    .folder-count {
      font-size: 10px;
      color: #92758e;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 10px;
      align-content: start;
    }

    .photo-item {
      position: relative;
      width: 92px;
      height: 92px;
      flex-shrink: 0;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
      border: 2.5px solid #a8ebd9;
      cursor: pointer;
      display: block;
    }

    /* 隅につける ❌ 削除ボタン */
    .corner-delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 9999px;
      border: 2px solid #ffffff;
      background: #ff7b93;
      color: #ffffff;
      font-size: 11px;
      line-height: 1;
      box-shadow: 0 2px 6px rgba(180, 60, 85, 0.35);
      z-index: 2;
    }

    .empty-history-msg {
      text-align: center;
      color: #9e879b;
      font-size: 13px;
      margin-top: 28px;
    }

    /* プレビューモーダル */
    #imagePreviewModal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(72, 55, 75, 0.75);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #previewImage {
      max-width: 88%;
      max-height: 76%;
      border-radius: 22px;
      border: 3.5px solid #a8ebd9;
      object-fit: contain;
      background: #ffffff;
    }

    .preview-hint {
      color: #5c475a;
      margin-top: 15px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.95);
      padding: 6px 16px;
      border-radius: 9999px;
    }
  </style>
</head>
<body>

  <!-- ================= ① HOME タブ ================= -->
  <div id="homeTab" class="tab-content active">
    <div class="app-header">Home</div>

    <div class="glass-card" style="padding: 40px 10px; gap: 36px;">
      <div style="font-size: 32px; font-weight: 800; letter-spacing: 5px; color: #5a4b57; font-family: monospace;">FINDRONE</div>

      <button class="btn-massive btn-find" onclick="goToTab('search')">
        <i class="bi bi-search"></i> 落とし物を探す
      </button>

      <button class="btn-massive btn-settings-link" onclick="goToTab('setting')">
        <i class="bi bi-gear"></i> 設定
      </button>
    </div>
  </div>

  <!-- ================= ② SEARCH タブ ================= -->
  <div id="searchTab" class="tab-content">
    <div class="app-header">search</div>

    <div class="glass-card">
      <!-- 検索ワード（初期値は空欄） -->
      <div class="input-wrapper">
        <input type="text" id="targetObject" value="" placeholder="探す物体を入力してください" autocomplete="off" />
        <button class="btn-decision" onclick="updateTarget()">決定</button>
      </div>

      <!-- 探索開始／探索終了ボタン（トグル式） -->
      <button id="startButton" onclick="startDetection()" disabled>探索開始</button>
      <!-- 隠し（既存の停止システムとの整合用） -->
      <button id="stopButton" onclick="stopDetection()" style="display: none;"></button>

      <!-- カメラ映像エリア -->
      <div class="viewfinder-outer">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="outputCanvas"></canvas>
      </div>

      <!-- ステータス表示 -->
      <div class="status-area" id="status">ステータス: PCと接続してください</div>

      <!-- フォルダボタン -->
      <button id="folderBtn" onclick="openHistoryFolder()">📂 発見した物体一覧</button>
    </div>
  </div>

  <!-- ================= ③ SETTING タブ ================= -->
  <div id="settingTab" class="tab-content">
    <div class="app-header">setting</div>

    <div class="glass-card">
      <!-- サーバーURL -->
      <div class="input-wrapper">
        <span class="input-icon"><i class="bi bi-laptop"></i></span>
        <input type="text" id="serverIp" placeholder="IPアドレスまたはURLを入力してください" />
        <button class="btn-connect" onclick="connectToServerOnly()">接続</button>
      </div>

      <!-- PCカメラ Peer ID -->
      <div class="input-wrapper">
        <span class="input-icon"><i class="bi bi-camera"></i></span>
        <input type="text" id="pcIdInput" placeholder="カメラのIDを入力してください" />
        <button class="btn-connect" onclick="connectToPC()">接続</button>
      </div>

      <!-- QRカメラ（スキャン開始／停止・トグル式） -->
      <button id="btn-qr" class="btn-qr-toggle" onclick="toggleQrScanner()"><i class="bi bi-qr-code-scan"></i> QRコードカメラ起動</button>
      <div id="qr-reader"></div>
      <div id="connectionStatus" style="font-size: 11px; color: #8c7388;">ステータス: 未接続</div>

      <!-- 設定保存ボタン -->
      <button class="btn-save" onclick="saveAllSettings()"><i class="bi bi-floppy"></i> この設定で保存</button>
    </div>
  </div>

  <!-- ================= 底部の固定ナビゲーションバー ================= -->
  <div class="nav-bar">
    <button id="nav-home" class="nav-item active" onclick="goToTab('home')">
      <i class="bi bi-house"></i>
      <span>Home</span>
    </button>
    <button id="nav-search" class="nav-item" onclick="goToTab('search')">
      <i class="bi bi-search"></i>
      <span>search</span>
    </button>
    <button id="nav-setting" class="nav-item" onclick="goToTab('setting')">
      <i class="bi bi-gear"></i>
      <span>setting</span>
    </button>
  </div>

  <!-- モーダル（フォルダ） -->
  <div id="historyFolderModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="historyModalTitle">📂 発見した物体一覧</h3>
        <div style="display: flex; gap: 6px;">
          <button id="backToFoldersBtn" class="btn-back-folder" onclick="backToFolderList()" style="display: none;">← 一覧</button>
          <button class="btn-clear" onclick="clearGallery()">履歴クリア</button>
          <button class="btn-close" onclick="closeHistoryFolder()">✕ 閉じる</button>
        </div>
      </div>
      <div id="imageGallery"></div>
    </div>
  </div>

  <!-- プレビュー -->
  <div id="imagePreviewModal" onclick="closePreview()">
    <img id="previewImage">
    <div class="preview-hint">画面をタップして閉じる</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
