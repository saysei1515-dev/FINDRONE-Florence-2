<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCサーバー連携 言葉探索カメラ</title>
  <link rel="stylesheet" href="style.css">
  <!-- PeerJSのみ維持（またはローカルIP直叩きの場合は不要ですが構成互換のため残しています） -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  <div class="app-container">
    <h1>🚀 PCサーバー連携 探索カメラ</h1>

    <!-- 1. PCのIPアドレス設定 -->
    <div class="control-group">
      <label for="serverIpInput">💻 パソコンのIPアドレス:</label>
      <div style="display: flex; gap: 5px; margin-bottom: 5px;">
        <input type="text" id="serverIpInput" placeholder="例: 192.168.1.15" style="flex: 1;">
        <button onclick="saveIp()" style="padding: 0 15px; background: #007bff; color: #fff; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">保存</button>
      </div>
      <div style="font-size: 11px; color: #888;">※PCのコマンドプロンプトで ipconfig と打って確認したIPv4アドレス</div>
    </div>

    <!-- 2. 探す言葉の入力 -->
    <div class="control-group" style="position: relative;">
      <label for="targetObject">🔍 探したいもの（自由な言葉）:</label>
      <div style="display: flex; gap: 5px;">
        <input type="text" id="targetObject" value="pen" placeholder="例: pen, bottle, cup" autocomplete="off" oninput="filterSuggestions()" style="flex: 1;">
        <button onclick="updateTarget()" style="padding: 0 15px; background: #007bff; color: #fff; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">決定</button>
      </div>
      <!-- COCOサジェストリスト -->
      <div id="customSuggestions" style="display: none; position: absolute; left: 10px; right: 10px; top: 65px; background: #181818; border: 1px solid #444; border-radius: 4px; max-height: 130px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5);"></div>
      <div style="font-size: 11px; color: #888; margin-top: 4px;">※YOLO-Worldは英語（pen, bottleなど）がおすすめです</div>
    </div>

    <!-- カメラ映像 & ボックス描画領域 -->
    <div class="camera-container" style="position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden;">
      <video id="video" autoplay muted playsinline style="width: 100%; display: block;"></video>
      <canvas id="outputCanvas" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
    </div>

    <!-- スタート・ストップボタン -->
    <div class="button-group" style="margin-top: 10px;">
      <button id="startButton" class="primary-btn" onclick="startCameraAndSearch()">探索スタート</button>
      <button id="stopButton" class="danger-btn" onclick="stopSearch()" style="display: none;">探索ストップ</button>
    </div>

    <div id="status" class="status-box">ステータス: 待機中</div>

    <!-- 発見履歴 -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
      <h3 style="margin: 0; font-size: 14px;">📁 発見したアイテムの履歴</h3>
      <button onclick="clearGallery()" style="padding: 5px 10px; background: #dc3545; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">履歴クリア</button>
    </div>
    <div id="imageGallery" class="gallery" style="display: flex; gap: 10px; overflow-x: auto; padding: 10px 0;"></div>
  </div>

  <!-- 画像プレビュー用モーダル -->
  <div id="imagePreviewModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; flex-direction: column;" onclick="closePreview()">
    <img id="previewImage" style="max-width: 90%; max-height: 80%; border-radius: 8px; border: 3px solid #00ff00; object-fit: contain;">
    <div style="color: #fff; margin-top: 15px; font-size: 14px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 4px;">画面をタップして閉じる</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
